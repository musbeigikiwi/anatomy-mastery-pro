<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORA Chapter 5 Mastery</title><link rel="stylesheet" href="exam-quiz.css"><style>body{overflow:hidden}.shell{height:100vh;display:flex;flex-direction:column}.topbar{flex:0 0 auto;padding:10px 12px;background:#07111f;border-bottom:1px solid var(--line)}.chapterNav{margin:0 auto;max-width:980px}.studyTabs{display:flex;gap:8px;max-width:980px;margin:8px auto 0;flex-wrap:wrap}.studyTabs button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-weight:800;padding:8px 12px}.studyTabs button.active{background:var(--accent);color:#00111e}.frame{border:0;width:100%;flex:1 1 auto;background:#07111f}</style></head><body><div class="shell"><div class="topbar"><nav class="chapterNav"><a href="exam-mastery.html">🏠 Hub</a><a class="active" href="chapter5.html">Ch 5</a><a href="chapter6-quiz.html">Ch 6</a><a href="chapter7-quiz.html">Ch 7</a><a href="chapter8-quiz.html">Ch 8</a></nav><div class="studyTabs"><button id="mcq" class="active">🎮 MCQ Game</button><button id="flash">🧠 Flashcards</button></div></div><iframe id="studyFrame" class="frame" src="chapter5-quiz.html" title="Chapter 5 study"></iframe></div><script>const f=document.getElementById('studyFrame'),m=document.getElementById('mcq'),fl=document.getElementById('flash');function openTab(type){const isMcq=type==='mcq';f.src=isMcq?'chapter5-quiz.html':'chapter5-flashcards.html';m.classList.toggle('active',isMcq);fl.classList.toggle('active',!isMcq);localStorage.setItem('ora-ch5-tab',type)}m.onclick=()=>openTab('mcq');fl.onclick=()=>openTab('flash');if(localStorage.getItem('ora-ch5-tab')==='flash')openTab('flash');</script></body></html>
