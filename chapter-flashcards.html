<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORA Flashcard Mastery</title><link rel="stylesheet" href="exam-quiz.css"><style>.fcwrap{max-width:900px;margin:auto;padding:14px}.fc{min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}.front{font-size:23px;font-weight:900;line-height:1.45}.back{font-size:18px;line-height:1.55;color:var(--muted);margin-top:18px}.hidden2{visibility:hidden}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.rating button{min-height:46px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.filters button{min-height:42px}.progressText{color:var(--muted);font-size:13px}.mastery{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.mastery span{border:1px solid var(--line);border-radius:10px;padding:7px 9px}@media(max-width:620px){.rating{grid-template-columns:1fr 1fr}.front{font-size:20px}.back{font-size:16px}}</style></head><body><main class="fcwrap"><nav class="chapterNav"><a href="exam-mastery.html">🏠 Hub</a><a href="chapter5.html">Ch 5</a><a id="n6" href="chapter6-quiz.html">Ch 6</a><a id="n7" href="chapter7-quiz.html">Ch 7</a><a id="n8" href="chapter8-quiz.html">Ch 8</a></nav><section class="card"><div class="tag">ACTIVE RECALL + SPACED REVIEW</div><div class="brand" id="title" style="margin-top:8px">ORA Flashcards</div><div class="sub">Tap the card to reveal the answer. Rate yourself: Again / Hard / Good / Mastered.</div><div id="filters" class="filters"></div><div class="mastery"><span>📚 <b id="total">0</b> cards</span><span>⏰ <b id="due">0</b> due</span><span>🔴 <b id="weak">0</b> weak</span><span>🔵 <b id="mastered">0</b> mastered</span></div></section><section class="card"><div class="progressText" id="counter">Loading…</div><div id="card" class="fc"><div><div class="front" id="front"></div><div class="back hidden2" id="back"></div></div></div><div class="rating"><button class="btn" data-rate="again">🔴 Again<br><small>5 min</small></button><button class="btn" data-rate="hard">🟠 Hard<br><small>12 h</small></button><button class="btn" data-rate="good">🟢 Good<br><small>2 days</small></button><button class="btn" data-rate="mastered">🔵 Mastered<br><small>7 days</small></button></div><div class="btnRow"><button class="btn" id="shuffle">🔀 Shuffle</button><button class="btn" id="dueBtn">⏰ Due Now</button><button class="btn" id="weakBtn">🎯 Weak Cards</button><button class="btn" id="reset">↻ Reset progress</button></div></section></main><script>const p=new URLSearchParams(location.search),ch=['6','7','8'].includes(p.get('ch'))?p.get('ch'):'6';document.getElementById('title').textContent=`ORA Chapter ${ch} Flashcard Mastery`;document.getElementById('n'+ch).classList.add('active');window.QUIZ_DATA=[];const s=document.createElement('script');s.src=`chapter${ch}-extra.js?v=4`;s.onload=init;document.head.appendChild(s);function init(){const all=window.QUIZ_DATA.map((q,i)=>({...q,id:i}));const key=`ora-ch${ch}-flash-progress`;let prog=JSON.parse(localStorage.getItem(key)||'{}'),pool=[...all],pos=0,revealed=false,lesson='all';const now=()=>Date.now(),save=()=>localStorage.setItem(key,JSON.stringify(prog));const dueTime=(id)=>prog[id]?.due||0;function stats(){document.getElementById('total').textContent=all.length;document.getElementById('due').textContent=all.filter(q=>dueTime(q.id)<=now()).length;document.getElementById('weak').textContent=all.filter(q=>['again','hard'].includes(prog[q.id]?.rating)).length;document.getElementById('mastered').textContent=all.filter(q=>prog[q.id]?.rating==='mastered').length}function renderFilters(){const f=document.getElementById('filters');const lessons=[...new Set(all.flatMap(q=>String(q.tags||'').match(new RegExp(ch+'\\.[0-3]','g'))||[]))].sort();f.innerHTML='';[['all','All'],...lessons.map(x=>[x,x])].forEach(([v,l])=>{const b=document.createElement('button');b.className='btn'+(lesson===v?' primary':'');b.textContent=l;b.onclick=()=>{lesson=v;pool=all.filter(q=>v==='all'||String(q.tags||'').includes(v));pos=0;renderFilters();render()};f.appendChild(b)})}function render(){if(!pool.length){document.getElementById('front').textContent='No cards in this set.';document.getElementById('back').textContent='';return}if(pos>=pool.length)pos=0;revealed=false;const q=pool[pos];document.getElementById('counter').textContent=`Card ${pos+1} of ${pool.length} • ${q.topic||''}`;document.getElementById('front').textContent=q.q;const b=document.getElementById('back');b.innerHTML=`<b>${q.a}</b><br><br>${q.e||''}`;b.classList.add('hidden2');stats()}document.getElementById('card').onclick=()=>{revealed=true;document.getElementById('back').classList.remove('hidden2')};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{if(!pool.length)return;const q=pool[pos],r=b.dataset.rate,ms=r==='again'?5*60e3:r==='hard'?12*3600e3:r==='good'?2*86400e3:7*86400e3;prog[q.id]={rating:r,due:now()+ms};save();pos=(pos+1)%pool.length;render()});document.getElementById('shuffle').onclick=()=>{pool.sort(()=>Math.random()-.5);pos=0;render()};document.getElementById('dueBtn').onclick=()=>{pool=all.filter(q=>dueTime(q.id)<=now()&&(lesson==='all'||String(q.tags||'').includes(lesson)));pos=0;render()};document.getElementById('weakBtn').onclick=()=>{pool=all.filter(q=>['again','hard'].includes(prog[q.id]?.rating)&&(lesson==='all'||String(q.tags||'').includes(lesson)));pos=0;render()};document.getElementById('reset').onclick=()=>{prog={};save();pool=[...all];pos=0;stats();render()};renderFilters();render()};</script></body></html>
